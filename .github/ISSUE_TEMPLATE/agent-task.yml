name: Agent implementation task
description: Define an Issue that can be safely delegated to one implementation agent.
title: "[Agent] "
labels: []
body:
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: Describe the observable result, not only implementation steps.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List independently verifiable criteria.
    validations:
      required: true
  - type: textarea
    id: write_scope
    attributes:
      label: Proposed write ownership
      description: Repository-relative files or directory/** patterns owned by this Issue.
      placeholder: |
        src/intent/**
        tests/test_travel_intent.py
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and ordering
      description: List blocking Issues or say "none". Parallel Issues must have disjoint write ownership.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Initial risk
      options:
        - high
        - medium
        - low
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Required validation
      description: Exact tests, build, lint, type check, and domain correctness checks.
    validations:
      required: true
