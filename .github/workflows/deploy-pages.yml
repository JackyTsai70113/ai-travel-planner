name: Deploy trip site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build canonical fixture landing page
        run: python3 -m src.golden_trip_renderer.build_site fixtures/trips/japan-5-day-trip-v1.json --output site
      - name: Build Awaji 2026 public bundle and React bundle
        run: |
          python3 scripts/build_awaji_public_bundle.py \
            --trip-path trips/awaji-naruto-tokushima-kobe-2026/trip.json \
            --web-output site/trips/awaji-2026/public-bundle.json
          npm --prefix web ci
          npm --prefix web run build
      - name: Publish Awaji trip page under /trips/awaji-2026/
        run: |
          mkdir -p site/trips/awaji-2026
          cp -R web/dist/. site/trips/awaji-2026/
      - name: Create root trip selector page
        run: |
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-Hant">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta http-equiv="refresh" content="0;url=./trips/awaji-2026/" />
              <title>Awaji Trip Dashboard</title>
              <style>
                body {
                  margin: 0;
                  font-family: Arial, Helvetica, sans-serif;
                  background: #f3f7fc;
                  color: #10233a;
                }
                .wrap {
                  max-width: 720px;
                  margin: 80px auto;
                  padding: 16px;
                  background: #fff;
                  border-radius: 14px;
                  border: 1px solid #c7d7ea;
                  box-shadow: 0 8px 22px rgba(0, 8, 30, 0.12);
                }
                a {
                  color: #1667b2;
                }
              </style>
            </head>
            <body>
              <div class="wrap">
                <h1>Awaji 2026 Golden Trip</h1>
                <p>請點選下列連結開啟旅途中可用頁面：</p>
                <ul>
                  <li>
                    <a href="./trips/awaji-2026/">2026 淡路島・鳴門家庭旅行</a>
                  </li>
                </ul>
                <p><a href="./trips/awaji-2026/public-bundle.json">Trip public bundle JSON</a></p>
                <noscript>若未自動跳轉，請點擊上方 trip 連結。</noscript>
              </div>
            </body>
          </html>
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
