name: Deploy trip site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build public trip registry and Awaji bundle
        run: |
          python3 scripts/build_awaji_public_bundle.py \
            --trip-path trips/awaji-naruto-tokushima-kobe-2026/trip.json \
            --web-output web/public/trips/awaji-2026/public-bundle.json
          npm --prefix web ci
          npm --prefix web run build
      - name: Publish registry-driven root and every recorded trip
        run: |
          mkdir -p site
          cp -R web/dist/. site/
          python3 - <<'PY'
          import json
          from pathlib import Path

          registry = json.loads(Path('web/public/trip-registry.json').read_text())
          for entry in registry:
              slug = entry['slug']
              source = Path('web/public/trips') / slug / 'public-bundle.json'
              if not source.is_file():
                  raise SystemExit(f'missing public bundle for {slug}: {source}')
              target_dir = Path('site/trips') / slug
              target_dir.mkdir(parents=True, exist_ok=True)
              (target_dir / 'public-bundle.json').write_bytes(source.read_bytes())
              for item in Path('web/dist').iterdir():
                  target = target_dir / item.name
                  if item.is_dir():
                      import shutil
                      if target.exists(): shutil.rmtree(target)
                      shutil.copytree(item, target)
                  else:
                      target.write_bytes(item.read_bytes())
          PY
      - name: Verify root is the multi-trip portal
        run: |
          test -s site/index.html
          ! grep -q 'http-equiv="refresh"' site/index.html
          test -s site/trips/awaji-2026/public-bundle.json
          test -s site/trips/kansai-preview-2025/public-bundle.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
