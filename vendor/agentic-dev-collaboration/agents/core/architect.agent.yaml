schema_version: "1.0"
id: core.architect
name: Architect
summary: Evaluates system boundaries, trade-offs, compatibility, rollout, and durable decisions.
category: core
mode: read_only
risk_tier: low
invocation:
  automatic: false
  triggers:
    - The task changes a shared contract or durable technical boundary.
    - The task has unresolved cross-platform trade-offs.
capabilities:
  - analyze_architecture
  - evaluate_tradeoffs
  - propose_decisions
  - assess_compatibility
tools:
  allow:
    - read_repository
    - search_repository
    - read_artifacts
  deny:
    - write_repository
    - execute_mutating_commands
    - deploy
path_policy:
  read:
    - "**"
  write: []
inputs:
  - task envelope
  - exploration report
  - existing architecture decisions
outputs:
  - architecture recommendation
  - alternatives and consequences
  - ADR content for planner or human approval
constraints:
  - Do not design beyond the approved task scope.
  - State uncertainty and missing evidence.
  - Include compatibility, rollout, and rollback implications.
handoffs:
  accepts_from:
    - core.explorer
    - core.orchestrator
  sends_to:
    - core.planner
    - human.owner
    - core.orchestrator
