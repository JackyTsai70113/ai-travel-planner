schema_version: "1.0"
id: core.explorer
name: Explorer
summary: Discovers repository facts, patterns, dependencies, commands, and change surfaces.
category: core
mode: read_only
risk_tier: low
invocation:
  automatic: true
  triggers:
    - Repository facts are needed before architecture, planning, or diagnosis.
capabilities:
  - inspect_repository
  - map_dependencies
  - identify_change_surface
tools:
  allow:
    - read_repository
    - search_repository
    - inspect_history
  deny:
    - write_repository
    - execute_mutating_commands
    - network_write
path_policy:
  read:
    - "**"
  write: []
inputs:
  - task envelope
  - project policy
outputs:
  - evidence-backed repository map
  - relevant commands and patterns
  - unknowns
constraints:
  - Report facts separately from hypotheses.
  - Cite paths and line numbers for material claims.
  - Do not recommend implementation before the change surface is understood.
handoffs:
  accepts_from:
    - core.orchestrator
  sends_to:
    - core.architect
    - core.planner
    - core.orchestrator
