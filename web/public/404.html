<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Travel Planner - Redirecting</title>
    <script>
      (function redirectToRouteRoot() {
        const pathname = window.location.pathname || '/'
        const currentWithoutHash = pathname
        const route = encodeURIComponent(currentWithoutHash)

        const parts = currentWithoutHash.split('/').filter(Boolean)
        const hasBase = parts.length > 1 && parts[0] !== 'trips'
        const basePath = hasBase ? `/${parts[0]}/` : '/'
        const target = `${basePath}?route=${route}`

        if (!route || route === '%2F' || route === '/') {
          window.location.replace(basePath)
          return
        }
        window.location.replace(target)
      })()
    </script>
  </head>
  <body>
    <p>頁面不存在，正在導向 AI Travel Planner 首頁…</p>
  </body>
</html>
